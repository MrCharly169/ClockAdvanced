name: Release

on:
  push:
    tags: ["v2026.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_card_runtime.js
      - run: python scripts/build_release.py --tag "${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'b') }}
          files: dist/clock_advanced.zip
