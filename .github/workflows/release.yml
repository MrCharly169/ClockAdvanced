name: Release

on:
  push:
    branches: [main, develop]
    paths:
      - custom_components/clock_advanced/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate bounded release version
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/clock_advanced/manifest.json"))["version"])')"
          if [[ "${{ github.ref_name }}" == "develop" && "$VERSION" =~ ^20[0-9]{2}\.([1-9]|1[0-2])\.[0-9]+b[0-9]$ ]]; then
            CHANNEL="beta"
          elif [[ "${{ github.ref_name }}" == "main" && "$VERSION" =~ ^20[0-9]{2}\.([1-9]|1[0-2])\.[0-9]+$ ]]; then
            CHANNEL="stable"
          else
            echo "::error::main requires YYYY.M.PATCH and develop requires bounded beta YYYY.M.PATCHb0..b9."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_card_runtime.js
      - run: python scripts/build_release.py --tag "v$VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Clock Advanced v${{ env.VERSION }}
          prerelease: ${{ env.CHANNEL == 'beta' }}
          make_latest: ${{ env.CHANNEL == 'stable' }}
          files: dist/clock_advanced.zip
