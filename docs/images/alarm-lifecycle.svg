<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Clock Advanced alarm lifecycle</title>
  <desc id="desc">An optional evening reminder leads to preparation and ringing. While ringing, repeat, snooze, and one-time escalation are separate paths. Dismiss or the safety timeout is followed by cleanup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
    <style>
      .title{font:700 36px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc}
      .subtitle{font:400 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#cbd5e1}
      .label{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc}
      .small{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#cbd5e1}
      .tiny{font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#94a3b8}
      .box{fill:#1e293b;stroke:#475569;stroke-width:2;rx:18;filter:url(#shadow)}
      .main{fill:#172554;stroke:#60a5fa}
      .terminal{fill:#173c32;stroke:#34d399}
      .warning{fill:#431407;stroke:#fb923c}
      .branch{fill:#2e1065;stroke:#a78bfa}
      .line{fill:none;stroke:#93c5fd;stroke-width:3;marker-end:url(#arrow)}
      .dash{stroke-dasharray:8 8}
    </style>
  </defs>

  <rect width="1440" height="720" rx="30" fill="url(#bg)"/>
  <text x="70" y="70" class="title">A complete alarm session</text>
  <text x="70" y="104" class="subtitle">Timing, actions, response and a defined finish — all configured in Home Assistant.</text>

  <rect x="70" y="160" width="190" height="92" class="box"/>
  <text x="165" y="196" text-anchor="middle" class="label">Evening reminder</text>
  <text x="165" y="220" text-anchor="middle" class="small">optional · exact occurrence</text>
  <text x="165" y="240" text-anchor="middle" class="tiny">skip · change once · open Card</text>

  <rect x="310" y="160" width="170" height="92" class="box main"/>
  <text x="395" y="198" text-anchor="middle" class="label">Prepare</text>
  <text x="395" y="224" text-anchor="middle" class="small">optional pre-alarm action</text>

  <rect x="535" y="160" width="210" height="92" class="box warning"/>
  <text x="640" y="196" text-anchor="middle" class="label">Start / Ringing</text>
  <text x="640" y="222" text-anchor="middle" class="small">Start also runs after snooze</text>

  <rect x="1020" y="160" width="160" height="92" class="box terminal"/>
  <text x="1100" y="198" text-anchor="middle" class="label">Dismiss</text>
  <text x="1100" y="224" text-anchor="middle" class="small">manual or confirmed</text>

  <rect x="1220" y="160" width="150" height="92" class="box terminal"/>
  <text x="1295" y="198" text-anchor="middle" class="label">Cleanup</text>
  <text x="1295" y="224" text-anchor="middle" class="small">always after finish</text>

  <path d="M260 206 H310" class="line dash"/>
  <path d="M480 206 H535" class="line"/>
  <path d="M745 206 H1020" class="line"/>
  <path d="M1180 206 H1220" class="line"/>

  <rect x="535" y="340" width="190" height="84" class="box"/>
  <text x="630" y="374" text-anchor="middle" class="label">Repeat</text>
  <text x="630" y="399" text-anchor="middle" class="small">cadence while ringing</text>
  <path d="M640 252 V340" class="line"/>
  <path d="M725 382 H790 V282 H705" class="line dash"/>

  <rect x="790" y="340" width="190" height="84" class="box branch"/>
  <text x="885" y="374" text-anchor="middle" class="label">Snooze</text>
  <text x="885" y="399" text-anchor="middle" class="small">pause · separate counter</text>
  <path d="M725 382 H790" class="line"/>
  <path d="M885 340 V292 H700 V252" class="line dash"/>
  <text x="802" y="282" class="tiny">when snooze ends</text>

  <rect x="535" y="505" width="445" height="92" class="box warning"/>
  <text x="757" y="540" text-anchor="middle" class="label">Escalate once</text>
  <text x="757" y="566" text-anchor="middle" class="small">after the configured repeat threshold or snooze threshold</text>
  <path d="M630 424 V505" class="line"/>
  <path d="M885 424 V470 H880 V505" class="line"/>
  <path d="M980 551 H1010 V292 H720" class="line dash"/>

  <rect x="1020" y="505" width="160" height="92" class="box warning"/>
  <text x="1100" y="540" text-anchor="middle" class="label">Timeout</text>
  <text x="1100" y="566" text-anchor="middle" class="small">complete-session limit</text>
  <path d="M745 226 H940 V551 H1020" class="line dash"/>
  <path d="M1180 551 H1295 V252" class="line"/>

  <rect x="70" y="635" width="1300" height="38" rx="19" fill="#0f172a" stroke="#334155"/>
  <text x="720" y="660" text-anchor="middle" class="small">The safety timer starts with the alarm session and continues across ringing and snooze periods, including restarts.</text>
</svg>
