<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Clock Advanced alarm source priority</title>
  <desc id="desc">A future one-time override has priority. Otherwise, the clock uses exactly one configured recurring source: the internal weekly schedule or a Home Assistant schedule entity. Conditions can block either source.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#64748b" flood-opacity=".25"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 34px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .subtitle{font:400 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
      .label{font:700 19px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
      .tiny{font:700 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1d4ed8}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:18;filter:url(#shadow2)}
      .priority{fill:#eff6ff;stroke:#2563eb}
      .source{fill:#f8fafc;stroke:#64748b}
      .result{fill:#ecfdf5;stroke:#10b981}
      .block{fill:#fff7ed;stroke:#f97316}
      .line{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrow2)}
      .dash{stroke-dasharray:8 8}
    </style>
  </defs>

  <rect width="1280" height="620" rx="30" fill="url(#bg2)"/>
  <text x="60" y="65" class="title">Where the next alarm time comes from</text>
  <text x="60" y="98" class="subtitle">One config entry chooses one recurring source. A future one-time value temporarily wins.</text>

  <rect x="60" y="145" width="260" height="100" class="box priority"/>
  <text x="190" y="180" text-anchor="middle" class="tiny">PRIORITY 1</text>
  <text x="190" y="209" text-anchor="middle" class="label">Future one-time override?</text>
  <text x="190" y="231" text-anchor="middle" class="small">datetime entity or reminder reply</text>

  <rect x="410" y="145" width="250" height="100" class="box result"/>
  <text x="535" y="180" text-anchor="middle" class="label">Use that exact time</text>
  <text x="535" y="207" text-anchor="middle" class="small">recurring schedule stays unchanged</text>
  <text x="535" y="229" text-anchor="middle" class="small">Recalculate clears the override</text>
  <path d="M320 190 H410" class="line"/>
  <text x="361" y="180" text-anchor="middle" class="tiny">YES</text>

  <path d="M190 245 V310 H410" class="line"/>
  <text x="210" y="287" class="tiny">NO</text>
  <rect x="410" y="275" width="250" height="76" class="box"/>
  <text x="535" y="306" text-anchor="middle" class="tiny">PRIORITY 2</text>
  <text x="535" y="332" text-anchor="middle" class="label">Configured recurring source</text>

  <path d="M535 351 V395 H305" class="line"/>
  <path d="M535 351 V395 H895" class="line"/>

  <rect x="60" y="395" width="490" height="132" class="box source"/>
  <text x="305" y="431" text-anchor="middle" class="label">Clock Advanced weekly schedule</text>
  <text x="305" y="459" text-anchor="middle" class="small">seven independently enabled weekdays</text>
  <text x="305" y="482" text-anchor="middle" class="small">Holiday time replaces the enabled day’s normal time</text>
  <text x="305" y="505" text-anchor="middle" class="small">a workday sensor may apply today’s non-workday time</text>

  <rect x="730" y="395" width="490" height="132" class="box source"/>
  <text x="975" y="431" text-anchor="middle" class="label">Home Assistant schedule.* entity</text>
  <text x="975" y="459" text-anchor="middle" class="small">next_event is displayed while inactive</text>
  <text x="975" y="482" text-anchor="middle" class="small">each new off → on block starts exactly one alarm</text>
  <text x="975" y="505" text-anchor="middle" class="small">an already-active startup block is handled once</text>

  <rect x="325" y="555" width="630" height="42" class="box block"/>
  <text x="640" y="582" text-anchor="middle" class="small">Enabled, Vacation and configured conditions are checked before either source can arm or start the alarm.</text>
  <path d="M305 527 V555" class="line dash"/>
  <path d="M975 527 V555" class="line dash"/>
</svg>
